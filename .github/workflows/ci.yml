on: [push, pull_request]

name: CI

jobs:
  check:
    name: Rust project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installs the toolchain from rust-toolchain.toml
      - uses: actions-rust-lang/setup-rust-toolchain@v2

      - name: Run cargo check
        run: cargo check
